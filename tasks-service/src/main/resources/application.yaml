server:
  port: 8080
  ssl:
    enabled: false
  forward-headers-strategy: framework

spring:
  application:
    name: tasks-service
  datasource:
    url: jdbc:postgresql://rdbms:5432/${TASKS_SERVICE_DB_NAME}
    username: ${TASKS_SERVICE_DB_USER}
    password: ${TASKS_SERVICE_DB_PASS}
    driver-class-name: org.postgresql.Driver
  data:
    rest:
      base-path: /api/v1
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${IAM_ISSUER_URI}
            aud: ${TASKS_SERVICE_AUD}
            username-claim: $.preferred_username
            authorities:
              - path: $.realm_access.roles
                prefix: ROLE_
              - path: $.resource_access.*.roles
                prefix: ROLE_
        resourceserver:
          permit-all:
            - /healthcheck

management:
  # 1. Метрики отправляются через Micrometer OTLP
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics

  # 2. Трассировка и логи обрабатываются встроенным OpenTelemetry SDK
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/logs

  # 3. Базовые настройки сэмплирования
  tracing:
    sampling:
      probability: 1.0
