databaseChangeLog:
  # Пересоздание таблицы files: @ElementCollection -> @Entity TaskFile (без переноса данных)
  - changeSet:
      id: 1-drop-old-files
      author: dipdeepcode
      changes:
        - dropTable:
            tableName: files

  - changeSet:
      id: 2-create-files-as-entities
      author: dipdeepcode
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_file
              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(255)
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_file_storage_key
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: task_id
            constraintName: fk_file_task
            referencedTableName: tasks
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_file_created_by
            tableName: files
            columns:
              - column:
                  name: created_by
