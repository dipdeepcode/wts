# yaml-language-server: $schema=https://raw.githubusercontent.com/srikanthccv/otelcol-jsonschema/main/schema.json

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql:
    endpoint: rdbms:5432
    transport: tcp
    username: ${OTEL_USER}
    password: ${OTEL_PASS}
    databases:
      - ${ROOT_DB_NAME}
      - ${IAM_DB_NAME}
      - ${SESSIONS_DB_NAME}
      - ${TASKS_SERVICE_DB_NAME}
    collection_interval: 10s

processors:
  batch:

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [otlp, postgresql]
      processors: [batch]
      exporters: [debug]
