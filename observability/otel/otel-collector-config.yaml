# yaml-language-server: $schema=https://raw.githubusercontent.com/srikanthccv/otelcol-jsonschema/main/schema.json

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql:
    endpoint: rdbms:5432
    transport: tcp
    username: ${OTEL_USER}
    password: ${OTEL_PASS}
    tls:
      insecure: true
    databases:
      - ${ROOT_DB_NAME}
      - ${IAM_DB_NAME}
      - ${SESSIONS_DB_NAME}
      - ${TASKS_SERVICE_DB_NAME}
    collection_interval: 10s

processors:
  batch: {}
  transform/postgres_compat:
    error_mode: ignore
    metric_statements:
      # 1. Сначала правим имена самих метрик (контекст metric)
      - context: metric
        statements:
          - set(name, "pg_stat_database_xact_commit") where name == "postgresql.commits"
          - set(name, "pg_stat_database_xact_rollback") where name == "postgresql.rollbacks"
          - set(name, "pg_stat_database_blks_read") where name == "postgresql.blocks_read"
          - set(name, "pg_stat_database_blks_hit") where name == "postgresql.blocks_hit"
          - set(name, "pg_stat_activity_count") where name == "postgresql.backends"

      # 2. Правим строки (tuples). Используем правильное имя "postgresql.rows" и атрибут "status"
      - context: datapoint
        statements:
          # Переименовываем метрики по условию статус-атрибута
          - set(metric.name, "pg_stat_database_tup_fetched") where metric.name == "postgresql.rows" and attributes["status"] == "fetched"
          - set(metric.name, "pg_stat_database_tup_inserted") where metric.name == "postgresql.rows" and attributes["status"] == "inserted"
          - set(metric.name, "pg_stat_database_tup_updated") where metric.name == "postgresql.rows" and attributes["status"] == "updated"
          - set(metric.name, "pg_stat_database_tup_deleted") where metric.name == "postgresql.rows" and attributes["status"] == "deleted"

          # ВАЖНО: Маппим лейбл базы данных под формат prometheus-exporter (из postgresql.database.name в datname)
          - set(attributes["datname"], attributes["postgresql.database.name"]) where attributes["postgresql.database.name"] != nil
          - delete_key(attributes, "postgresql.database.name")

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [otlp, postgresql]
      processors: [transform/postgres_compat, batch]
      exporters: [prometheus, debug]
