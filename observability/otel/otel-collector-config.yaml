# yaml-language-server: $schema=https://raw.githubusercontent.com/srikanthccv/otelcol-jsonschema/main/schema.json

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql:
    endpoint: rdbms:5432
    transport: tcp
    username: ${OTEL_USER}
    password: ${OTEL_PASS}
    tls:
      insecure: true
    databases:
      - ${ROOT_DB_NAME}
      - ${IAM_DB_NAME}
      - ${SESSIONS_DB_NAME}
      - ${TASKS_SERVICE_DB_NAME}
    collection_interval: 10s

processors:
  batch: {}
  transform/postgres_compat:
    error_mode: ignore
    metric_statements:
      # Для простых переименований без условий по атрибутам оставляем контекст metric,
      # так как это работает быстрее и эффективнее.
      - context: metric
        statements:
          # Маппинг транзакций (Commits & Rollbacks)
          - set(name, "pg_stat_database_xact_commit") where name == "postgresql.commits"
          - set(name, "pg_stat_database_xact_rollback") where name == "postgresql.rollbacks"

          # Маппинг чтения блоков (Cache Hit Rate)
          - set(name, "pg_stat_database_blks_read") where name == "postgresql.blocks_read"
          - set(name, "pg_stat_database_blks_hit") where name == "postgresql.blocks_hit"

          # Маппинг сессий
          - set(name, "pg_stat_activity_count") where name == "postgresql.backends"

      # Для маппинга строк, где нужно проверять атрибут [operation],
      # переключаемся на контекст datapoint.
      - context: datapoint
        statements:
          - set(metric.name, "pg_stat_database_tup_fetched") where metric.name == "postgresql.operations" and attributes["operation"] == "fetch"
          - set(metric.name, "pg_stat_database_tup_inserted") where metric.name == "postgresql.operations" and attributes["operation"] == "insert"
          - set(metric.name, "pg_stat_database_tup_updated") where metric.name == "postgresql.operations" and attributes["operation"] == "update"
          - set(metric.name, "pg_stat_database_tup_deleted") where metric.name == "postgresql.operations" and attributes["operation"] == "delete"

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

    metrics:
      receivers: [otlp, postgresql]
      processors: [transform/postgres_compat, batch]
      exporters: [prometheus, debug]
