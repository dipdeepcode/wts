name: Copy Nginx configurations

on:
  push:
    branches:
      - master
    paths:
      - 'nginx/**'
      - '.github/workflows/deploy-web-ui.yml'
  workflow_run:
    workflows:
      - "Deploy Infrastructure (Postgres, Keycloak)"
    types:
      - completed
permissions: {}

jobs:
  copy:
    name: Copy Nginx configurations
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "nginx/*.conf"
          target: "/etc/nginx/vhosts-includes"
          strip_components: 1
          rm: true
