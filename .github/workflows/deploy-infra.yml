name: Deploy Infrastructure (Postgres, Keycloak)

on: workflow_dispatch
permissions: {}

jobs:

  create_env:
    permissions:
      contents: read
    uses: ./.github/workflows/create_env.yml
    secrets: inherit

  deploy:
    name: Deploy infrastructure
    environment: production
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: create_env

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Postgres Image
        uses: docker/build-push-action@v7
        with:
          context: ./rdbms
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.RDBMS_IMAGE_NAME }}

      - name: Build and Push Keycloak Image
        uses: docker/build-push-action@v7
        with:
          context: ./iam
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IAM_IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Directory via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ vars.SERVER_PROJECT_PATH }}

      - name: Copy Config Files to VDS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml"
          target: "${{ vars.SERVER_PROJECT_PATH }}"

      - name: Deploy to VDS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd "${{ vars.SERVER_PROJECT_PATH }}"

            docker compose pull rdbms iam
            docker compose up -d --remove-orphans rdbms iam dozzle
            docker image prune -f

            echo "Waiting for Keycloak to become healthy..."
            TIMEOUT=60
            ELAPSED=0
            while [ "$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q iam))" != "healthy" ]; do
                if [ $ELAPSED -eq $TIMEOUT ]; then
                    echo "Timed out waiting for Keycloak to start."
                    exit 1
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
                echo "Still waiting... (${ELAPSED}s)"
            done
            echo "Keycloak is up and running!"
            
            docker compose exec -T iam /opt/keycloak/bin/kcadm.sh config credentials \
              --server http://localhost:8080 \
              --realm master \
              --user "${{ secrets.KEYCLOAK_ADMIN_USER }}" \
              --password "${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}"
            
            REALM_NAME=${{ vars.KC_REALM_NAME }}
            
            if docker compose exec -T iam /opt/keycloak/bin/kcadm.sh get realms/$REALM_NAME > /dev/null 2>&1; then
                echo "Realm '$REALM_NAME' already exists. Skipping creation."
            else
                echo "Creating realm '$REALM_NAME'..."
                docker compose exec -T iam /opt/keycloak/bin/kcadm.sh create realms -s realm=$REALM_NAME -s enabled=true
            fi
