server:
  port: 8080
  ssl:
    enabled: false
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-reactive
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${IAM_ISSUER_URI}
        registration:
          keycloak:
            provider: keycloak
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-id: ${GATEWAY_CLIENT_ID}
            client-secret: ${GATEWAY_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
              - tasks-service-api
  data:
    redis:
      host: redis-session
      port: 6379
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: "gateway:session"
      repository-type: indexed
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: ".*"
      routes:
        - id: tasks-service
          uri: http://tasks-service:8080/
          predicates:
            - Path=/api, /api/**
          filters:
            - TokenRelay=
            - RemoveRequestHeader=Cookie
        - id: otel-collector
          uri: http://otel-collector:4318/
          predicates:
            - Path=/otel/v1/traces, /otel/v1/metrics, /otel/v1/logs
          filters:
            - StripPrefix=1
            - RemoveRequestHeader=Cookie

com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${IAM_ISSUER_URI}
            aud: ${GATEWAY_AUD}
            authorities:
              - path: $.realm_access.roles
                prefix: ROLE_
        client:
          client-uri: ${FRONTEND_URL}
          post-login-allowed-uri-patterns:
            - ${FRONTEND_URL}/workspaces.*
            - ${FRONTEND_URL}/?
          post-logout-allowed-uri-patterns:
            - ${FRONTEND_URL}(/.*)?$
          security-matchers:
            - /login/**
            - /oauth2/**
            - /logout/**
            - /api/**
            - /bff/**
            - /otel/**
          permit-all:
            - /login/**
            - /oauth2/**
            - /bff/login-options
            - /logout/connect/back-channel/**
          csrf: cookie-accessible-from-js
          oauth2-redirections:
            rp-initiated-logout: ACCEPTED
            authentication-entry-point: UNAUTHORIZED
          pkce-forced: true
          back-channel-logout:
            enabled: true